services:
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: cloudscale-backend
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: cloudscale-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
